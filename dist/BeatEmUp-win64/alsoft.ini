# OpenAL Soft settings for BeatEmUp, loaded through ALSOFT_CONF by conf.lua.
# The default device buffer is 882 frames x 3 (~60 ms). This asks for 256 x 2; Windows'
# shared-mode floor turns that into 441 x 2 (~20 ms). If you hear crackling, delete this
# file or raise the numbers.
[general]
period_size = 256
periods = 2
